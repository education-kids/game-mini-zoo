<style>
/**
 * Petualangan Mini Zoo - Safari Adventure Design System
 * 16:9 Responsive Canvas & Tactile Claymorphism UI
 * Target Audience: Siswa Kelas 4 Sekolah Dasar
 * Strict Zero-Jitter Centered Button Rules & WCAG AAA Accessibility
 */

/* ==========================================================================
   1. DESIGN TOKENS & CSS VARIABLES
   ========================================================================== */
:root {
  /* Typography */
  --font-game: 'Fredoka', 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;

  /* Safari Theme Colors */
  --color-forest-dark: #0B2312;
  --color-forest-medium: #1B4323;
  --color-forest-light: #2D6A35;
  --color-forest-accent: #3E8E48;

  /* Safari Timber & Warm Gold */
  --color-wood-dark: #451A03;
  --color-wood-medium: #78350F;
  --color-wood-light: #9A3412;
  --color-wood-border: #B45309;
  --color-gold: #F59E0B;
  --color-gold-light: #FDE68A;
  --color-gold-glow: #FBBF24;
  --color-amber-dark: #78350F;

  /* Kingdom 1: Karnivora Crimson */
  --color-karnivora: #DC2626;
  --color-karnivora-bg: #450A0A;
  --color-karnivora-border: #EF4444;
  --color-karnivora-glow: #F87171;

  /* Kingdom 2: Herbivora Emerald */
  --color-herbivora: #16A34A;
  --color-herbivora-bg: #052E16;
  --color-herbivora-border: #22C55E;
  --color-herbivora-glow: #4ADE80;

  /* Kingdom 3: Omnivora Purple */
  --color-omnivora: #7C3AED;
  --color-omnivora-bg: #2E1065;
  --color-omnivora-border: #8B5CF6;
  --color-omnivora-glow: #A78BFA;

  /* Neutral & Parchment Tones */
  --color-parchment: #FFFDF0;
  --color-parchment-deep: #FEF9C3;
  --color-parchment-border: #D97706;
  --color-text-dark: #1E293B;
  --color-text-medium: #334155;
  --color-text-light: #F8FAFC;
  --color-text-gold: #FEF3C7;

  /* Tactile Shadows */
  --shadow-button-green: 0 6px 0 #0D3B10, 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.6);
  --shadow-button-gold: 0 6px 0 #78350F, 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.6);
  --shadow-button-wood: 0 5px 0 #2A1002, 0 8px 16px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.4);
  --shadow-clay-card: 0 8px 0 rgba(0, 0, 0, 0.25), 0 16px 28px rgba(0, 0, 0, 0.45);
}

/* ==========================================================================
   2. GLOBAL RESET & BASE STYLES
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow-x: hidden;
  background-color: var(--color-forest-dark);
  font-family: var(--font-game);
  color: var(--color-text-light);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ==========================================================================
   3. RESPONSIVE 16:9 CANVAS VIEWPORT & STAGE
   ========================================================================== */
.game-viewport {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0B1120;
  padding: 0;
  margin: 0;
  overflow: hidden;
}

.game-app-shell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 1140px;
  height: 100%;
  max-height: 100vh;
  margin: 0 auto;
  box-sizing: border-box;
}

.game-canvas-container,
.slide-canvas-stage {
  position: relative;
  width: 100%;
  max-width: 1140px;
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 48px);
  margin: 0 auto;
  overflow: hidden;
  background-color: var(--color-forest-dark);
  border-radius: 0 0 16px 16px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
}

/* ==========================================================================
   4. SPA SCREEN VISIBILITY RULES
   ========================================================================== */
.screen,
.game-screen {
  display: none !important;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 70px 24px 20px 24px !important;
  box-sizing: border-box;
  overflow-y: auto;
  overflow-x: hidden;
}

.screen.active,
.game-screen.active {
  display: flex !important;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

/* ==========================================================================
   5. STRICT ZERO-JITTER BUTTON RULES (CRITICAL REQUIREMENT)
   Preserves translateX(-50%) on base, :hover, and :active states.
   ========================================================================== */
.hotspot-splash-start,
.hotspot-instructions-start,
.hotspot-gate-start,
.hotspot-reward-continue,
.btn-centered {
  position: absolute;
  left: 50% !important;
  transform: translateX(-50%) !important;
  cursor: pointer !important;
  pointer-events: auto !important;
  transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
  animation: none !important;
}

.hotspot-splash-start:hover,
.hotspot-instructions-start:hover,
.hotspot-gate-start:hover,
.hotspot-reward-continue:hover,
.btn-centered:hover,
.hotspot-splash-start:focus-visible,
.hotspot-instructions-start:focus-visible,
.hotspot-gate-start:focus-visible,
.hotspot-reward-continue:focus-visible,
.btn-centered:focus-visible {
  transform: translateX(-50%) translateY(-2px) !important;
  filter: brightness(1.08);
}

.hotspot-splash-start:active,
.hotspot-instructions-start:active,
.hotspot-gate-start:active,
.hotspot-reward-continue:active,
.btn-centered:active {
  transform: translateX(-50%) translateY(3px) !important;
  box-shadow: 0 2px 0 #0D3B10, 0 4px 10px rgba(0, 0, 0, 0.5) !important;
}

/* Prevent child elements (labels, spans, icons) from intercepting button clicks */
.slide-hotspot-cta span,
.pro-game-cta-btn span,
.cta-play-icon,
.cta-btn-label,
.btn-3d-green span,
.btn-3d-gold span,
.btn-3d-wood span,
.btn-clay span,
.btn-clay svg,
.btn-quiz-option *,
.green-glossy-inner,
.green-btn-label,
.wood-framed-green-btn * {
  pointer-events: none !important;
}

/* ==========================================================================
   6. TACTILE 3D BUTTON STYLING (FIGMA "UI BUTTON FOR KIDS" DESIGN SYSTEM)
   ========================================================================== */
.btn-3d-green {
  background: linear-gradient(180deg, #66BB6A 0%, #2E7D32 50%, #1B5E20 100%);
  border: 3.5px solid #FFE082;
  box-shadow: 0 7px 0 #0D3B10, 0 12px 22px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.65), inset 0 -3px 0 rgba(0,0,0,0.2);
  color: #FFFFFF;
  text-shadow: 0 2.5px 0 #0D3B10, 0 4px 8px rgba(0, 0, 0, 0.5);
  font-family: var(--font-game);
  font-weight: 800;
  border-radius: 9999px;
  padding: 13px 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  font-size: 1.25rem;
  letter-spacing: 0.04em;
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
  transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.12s ease;
}

.btn-3d-green:hover:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(-2px);
  filter: brightness(1.08);
  box-shadow: 0 9px 0 #0D3B10, 0 16px 26px rgba(0,0,0,0.45), inset 0 4px 0 rgba(255,255,255,0.75);
}

.btn-3d-green:active:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #0D3B10, 0 4px 10px rgba(0, 0, 0, 0.5) !important;
}

.btn-3d-gold {
  background: linear-gradient(180deg, #FBBF24 0%, #D97706 50%, #92400E 100%);
  border: 3.5px solid #FFFBEB;
  box-shadow: 0 7px 0 #78350F, 0 12px 22px rgba(0,0,0,0.4), inset 0 4px 0 rgba(255,255,255,0.65), inset 0 -3px 0 rgba(0,0,0,0.2);
  color: #FFFFFF;
  text-shadow: 0 2.5px 0 #78350F, 0 4px 8px rgba(0, 0, 0, 0.5);
  font-family: var(--font-game);
  font-weight: 800;
  border-radius: 9999px;
  padding: 13px 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-decoration: none;
  font-size: 1.25rem;
  letter-spacing: 0.04em;
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
  transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.12s ease;
}

.btn-3d-gold:hover:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(-2px);
  filter: brightness(1.08);
  box-shadow: 0 9px 0 #78350F, 0 16px 26px rgba(0,0,0,0.45), inset 0 4px 0 rgba(255,255,255,0.75);
}

.btn-3d-gold:active:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #78350F, 0 4px 10px rgba(0, 0, 0, 0.5) !important;
}

.btn-3d-wood {
  background: linear-gradient(180deg, #B45309 0%, #78350F 50%, #451A03 100%);
  border: 3px solid #FDE68A;
  box-shadow: 0 6px 0 #2A1002, 0 10px 18px rgba(0,0,0,0.4), inset 0 3px 0 rgba(255,255,255,0.5), inset 0 -2px 0 rgba(0,0,0,0.3);
  color: #FFFDF0;
  text-shadow: 0 2.5px 0 #2A1002, 0 4px 8px rgba(0, 0, 0, 0.7);
  font-family: var(--font-game);
  font-weight: 800;
  border-radius: 9999px;
  padding: 11px 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
  transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.12s ease;
}

.btn-3d-wood:hover:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(-2px);
  filter: brightness(1.08);
  box-shadow: 0 8px 0 #2A1002, 0 14px 22px rgba(0,0,0,0.45), inset 0 3px 0 rgba(255,255,255,0.6);
}

.btn-3d-wood:active:not(.btn-centered):not(.hotspot-splash-start):not(.hotspot-instructions-start):not(.hotspot-gate-start):not(.hotspot-reward-continue) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #2A1002, 0 4px 10px rgba(0, 0, 0, 0.5) !important;
}

/* Wood-Framed Green Capsule Button (Exact Match to Figma Community Kit) */
.wood-framed-green-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px;
  border-radius: 9999px;
  background: linear-gradient(180deg, #FBBF24 0%, #D97706 55%, #92400E 100%);
  border: 4px solid #451A03;
  box-shadow: 0 7px 0 #451A03, 0 12px 24px rgba(0,0,0,0.45), inset 0 2px 0 #FEF08A;
  cursor: pointer;
  text-decoration: none;
  box-sizing: border-box;
}

.green-glossy-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 30px;
  border-radius: 9999px;
  background: linear-gradient(180deg, #84CC16 0%, #4D7C0F 45%, #15803D 100%);
  border: 2.5px solid #14532D;
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.55), inset 0 -3px 0 rgba(0, 0, 0, 0.25);
  box-sizing: border-box;
}

.green-btn-label {
  font-family: var(--font-game);
  font-size: 1.35rem;
  font-weight: 900;
  line-height: 1.1;
  color: #FFFFFF;
  text-align: center;
  text-shadow:
    0 3px 0 #052E16,
    -1.5px -1.5px 0 #052E16,
    1.5px -1.5px 0 #052E16,
    -1.5px 1.5px 0 #052E16,
    1.5px 1.5px 0 #052E16;
}

/* Generic Clay Button */
.btn-clay {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-game);
  font-weight: 700;
  cursor: pointer;
  border: none;
  outline: none;
  touch-action: manipulation;
  transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
}

/* ==========================================================================
   CARTOON WOODEN SIGNS & PARCHMENT SPEECH BUBBLE COMPONENTS
   ========================================================================== */
.wood-hanging-sign {
  position: absolute;
  top: 14px;
  left: 18px;
  z-index: 30;
  background: linear-gradient(180deg, #F59E0B 0%, #D97706 45%, #B45309 100%);
  border: 3.5px solid #451A03;
  border-radius: 16px;
  padding: 6px 20px;
  box-shadow: 0 5px 0 #451A03, 0 10px 18px rgba(0,0,0,0.35), inset 0 2.5px 0 rgba(254, 240, 138, 0.6);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.wood-hanging-sign::before,
.wood-hanging-sign::after {
  content: '';
  position: absolute;
  top: -20px;
  width: 7px;
  height: 20px;
  background: repeating-linear-gradient(45deg, #D97706, #D97706 3px, #78350F 3px, #78350F 6px);
  border: 2px solid #451A03;
  border-radius: 3px;
}
.wood-hanging-sign::before { left: 18px; }
.wood-hanging-sign::after { right: 18px; }

.wood-sign-text {
  font-family: var(--font-game);
  font-size: 1.25rem;
  font-weight: 900;
  color: #FFFDF0;
  letter-spacing: 0.5px;
  text-shadow:
    0 3px 0 #451A03,
    -1.5px -1.5px 0 #451A03,
    1.5px -1.5px 0 #451A03,
    -1.5px 1.5px 0 #451A03,
    1.5px 1.5px 0 #451A03;
}

.parchment-speech-bubble {
  position: relative;
  background: radial-gradient(circle at 50% 40%, #FFFDF5 0%, #FEF3C7 75%, #FDE68A 100%);
  border: 3.5px solid #92400E;
  border-radius: 28px;
  padding: 16px 24px;
  box-shadow: 0 7px 0 rgba(120, 53, 15, 0.35), 0 12px 24px rgba(0,0,0,0.25), inset 0 0 0 2.5px rgba(255, 255, 255, 0.7);
  color: #451A03;
}

.parchment-speech-bubble.tail-left::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 50%;
  transform: translateY(-50%);
  border-width: 12px 22px 12px 0;
  border-style: solid;
  border-color: transparent #92400E transparent transparent;
}
.parchment-speech-bubble.tail-left::after {
  content: '';
  position: absolute;
  left: -16px;
  top: 50%;
  transform: translateY(-50%);
  border-width: 9px 18px 9px 0;
  border-style: solid;
  border-color: transparent #FEF3C7 transparent transparent;
}

.text-stroke-brown {
  text-shadow:
    0 3.5px 0 #451A03,
    -2px -2px 0 #451A03,
    2px -2px 0 #451A03,
    -2px 2px 0 #451A03,
    2px 2px 0 #451A03,
    0 6px 12px rgba(0,0,0,0.45);
}

/* ==========================================================================
   7. FLOATING CONTROLS (TOP HUD, AUDIO & NAVIGATION)
   ========================================================================== */
.top-hud-container {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: transparent !important;
  border-bottom: none !important;
  box-shadow: none !important;
  box-sizing: border-box;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  pointer-events: none !important;
}

.hud-left-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hud-back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 9999px;
  font-size: 0.86rem;
  font-weight: 800;
  cursor: pointer;
  background: linear-gradient(180deg, #78350F 0%, #451A03 100%);
  border: 2px solid var(--color-gold);
  color: var(--color-gold-light);
  box-shadow: 0 3px 0 #2A1002, 0 4px 8px rgba(0, 0, 0, 0.35);
  transition: transform 0.1s ease, filter 0.1s ease;
  min-height: 36px;
}

.hud-back-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.hud-back-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #2A1002 !important;
}

.hud-back-btn span,
.hud-back-btn svg,
.hud-back-btn * {
  pointer-events: none !important;
}

.hud-crystals-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #451A03 0%, #2A1002 100%);
  border: 2px solid var(--color-gold);
  border-radius: 9999px;
  padding: 3px 10px;
  box-shadow: 0 3px 0 #180800, inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.hud-crystal-slot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.55);
  border: 1.5px dashed rgba(245, 158, 11, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.hud-crystal-slot.crystal-collected {
  background: radial-gradient(circle, #F59E0B 0%, #78350F 85%);
  border: 2px solid #FEF08A;
  box-shadow: 0 0 12px rgba(245, 158, 11, 0.85);
}

.hud-crystal-slot svg {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.hud-center-section {
  display: flex;
  align-items: center;
  justify-content: center;
}

.hud-realm-badge-group {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(0, 0, 0, 0.55);
  border: 2px solid var(--color-wood-medium);
  border-radius: 9999px;
  padding: 3px 14px 3px 5px;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 3px 8px rgba(0, 0, 0, 0.35);
}

.quiz-kingdom-badge {
  font-size: 0.88rem;
  font-weight: 900;
  padding: 4px 14px;
  border-radius: 9999px;
  color: #FFFFFF;
  background-color: var(--color-karnivora);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
  letter-spacing: 0.4px;
}

.quiz-level-indicator {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--color-gold-light);
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
}

.hud-right-section.floating-header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-fullscreen-toggle,
.btn-sound-toggle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(180deg, #78350F 0%, #451A03 100%);
  border: 2px solid var(--color-gold);
  color: var(--color-gold-light);
  box-shadow: 0 3px 0 #2A1002, 0 4px 8px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  transition: transform 0.1s ease, filter 0.1s ease;
}

.btn-fullscreen-toggle:hover,
.btn-sound-toggle:hover {
  transform: translateY(-2px);
  filter: brightness(1.15);
}

.btn-fullscreen-toggle:active,
.btn-sound-toggle:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #2A1002 !important;
}

.btn-sound-toggle.sound-muted .sound-wave {
  display: none;
}

.btn-sound-toggle.sound-muted .sound-slash {
  display: block !important;
}

.session-resume-box,
#session-resume-box {
  display: none;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 16px;
  width: auto;
  max-width: 90%;
  position: absolute;
  top: 76%;
  bottom: auto;
  left: 54%;
  transform: translateX(-50%);
  z-index: 60;
}

#screen-splash:not(.has-saved-session) #session-resume-box {
  display: none !important;
}

#screen-splash.has-saved-session #session-resume-box {
  display: flex !important;
}

#screen-splash.has-saved-session #btn-start-adventure,
#screen-splash.has-saved-session .splash-cta-container {
  display: none !important;
}

#btn-resume-adventure {
  height: 50px !important;
  padding: 0 24px !important;
  background: linear-gradient(180deg, #F59E0B 0%, #D97706 60%, #B45309 100%) !important;
  border: 3px solid #78350F !important;
  border-radius: 9999px !important;
  box-shadow: 0 6px 0 #451A03, 0 10px 20px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.6) !important;
  color: #FFFFFF !important;
  font-family: var(--font-game, 'Fredoka', sans-serif) !important;
  font-size: clamp(0.95rem, 1.8vw, 1.15rem) !important;
  font-weight: 800 !important;

  padding: 62px 24px 16px 24px !important;

/* MiniMap Horizontal Track */
.minimap-wrapper {
  background: linear-gradient(180deg, #F59E0B 0%, #B45309 100%);
  border-radius: 9999px;
  padding: 5px 18px;
  border: 3px solid #451A03;

.minimap-counter {

  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex: 0 0 auto;
}

.step-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 900;
  transition: all 0.2s ease;
  box-sizing: border-box;
}

.step-completed .step-badge {
  background: #22C55E;
  border: 2px solid #14532D;
  color: #FFFFFF;
}

.step-active .step-badge {
  background: linear-gradient(180deg, #FACC15 0%, #EA580C 100%);
  border: 2.5px solid #FFFFFF;
  color: #2A1002;
  box-shadow: 0 0 10px #FACC15;
}

.step-locked .step-badge {
  background: #64748B;
  border: 2px solid #334155;
  color: #CBD5E1;
}

.step-label {
  font-size: 0.7rem;
  color: #FEF9C3;
  font-weight: 700;
}

.step-active .step-label {
  color: #FFFFFF;
  font-weight: 900;
}

.minimap-connector {

  height: 4px;
  background: rgba(69, 26, 3, 0.5);
  border-radius: 2px;
}

.minimap-connector.connector-filled {
  background: #FEF08A;
  box-shadow: 0 0 6px #FEF08A;
}

/* Challenge Stage (Left: Visual & Clue, Right: Options) */
.quiz-main-stage {
  display: grid;
  grid-template-columns: 1.15fr 1.25fr;
  gap: 20px;
  flex: 1;
  align-items: center;
  z-index: 20;
}

.quiz-clue-card {
  background: linear-gradient(180deg, #FFFDF5 0%, #FEF9C3 100%);
  color: var(--color-text-dark);
  border-radius: 24px;
  padding: 16px 20px;
  border: 4px solid #78350F;
  box-shadow: 0 8px 0 #451A03, 0 14px 26px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}

.quiz-animal-visual {

  height: 155px;
  margin: 0 auto 6px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.animal-stage-frame {
  width: 100%;
  height: 100%;
  border-radius: 20px;
  overflow: visible;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Character Pedestal Spotlight & Ground Shadow for Cutout Character */
.animal-stage-frame::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 20px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 75%);
  z-index: 1;
  pointer-events: none;
}

.animal-photo-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.45));
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.animal-stage-frame:hover .animal-photo-img {
  transform: scale(1.08) translateY(-4px);
}

.quiz-animal-visual svg {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.quiz-question {

  font-size: 1.55rem;
  font-weight: 900;
  color: #451A03;
  margin-bottom: 6px;

  flex-direction: column;
  gap: 12px;
  justify-content: center;
}

.btn-quiz-option {
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFBEB 55%, #FEF3C7 100%);
  border: 3.5px solid #78350F;
  border-radius: 20px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  box-shadow: 0 6px 0 #451A03, 0 10px 18px rgba(0, 0, 0, 0.35);

.btn-quiz-option:hover {

  box-shadow: 0 8px 0 #451A03, 0 14px 22px rgba(0, 0, 0, 0.4);

.btn-quiz-option:active {

}

  align-items: center;
  justify-content: center;
  font-size: 1.25rem;

  color: #FFFFFF;

.option-text {

  font-size: 1.3rem;

  text-align: left;

/* ==========================================================================
   13. FEEDBACK MODAL (#modal-feedback / #feedback-modal)
   ========================================================================== */
#modal-feedback,
#feedback-modal {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}

.feedback-modal-content {
  background: #FFFDF0;
  color: var(--color-text-dark);
  border: 4.5px solid var(--color-wood-medium);
  border-radius: 24px;
  padding: 24px 30px;
  max-width: 580px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 0 4px var(--color-gold);
  animation: modalPopIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes modalPopIn {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.feedback-title {
  font-family: var(--font-game);
  font-size: 1.85rem;
  font-weight: 900;
  margin-bottom: 12px;
  color: var(--color-wood-dark);
}

.feedback-title.correct {
  color: #15803D;
}

.feedback-title.retry {
  color: #DC2626;
}

.feedback-text {
  font-size: 1.12rem;
