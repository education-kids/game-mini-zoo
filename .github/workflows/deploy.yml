name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site/assets/slides _site/assets/minimaps _site/assets/animals
          cp index.html _site/
          cp manifest.json _site/
          cp sw.js _site/
          cp .nojekyll _site/
          cp assets/slides/*.jpg _site/assets/slides/ || true
          cp assets/minimaps/*.jpg _site/assets/minimaps/ || true
          cp assets/animals/*.jpg _site/assets/animals/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
